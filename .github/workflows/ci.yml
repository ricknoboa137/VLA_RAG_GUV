name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Types
        run: mypy --strict src

      - name: Tests
        run: pytest -q -m "not sim" --cov=carma --cov-report=term-missing

      - name: Dependency pin gate
        run: python scripts/check_pins.py

  # The path a colleague actually uses. Without this job the shareable image
  # is only ever tested by hand, and the locks drift from pyproject.toml
  # unnoticed.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the library and dev images
        run: docker compose -f docker/compose.yaml build lib check

      - name: Every gate, inside the image
        run: docker compose -f docker/compose.yaml run --rm check

      - name: A real experiment, inside the image
        run: docker compose -f docker/compose.yaml run --rm lib carma run --config configs/experiment/smoke.yaml --seed 0
