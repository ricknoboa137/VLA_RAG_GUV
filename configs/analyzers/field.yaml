# Scene analyzers run on the live camera by the carma_vision analysis node.
# Kept apart from experiment configs: analyzers describe the scene and never
# change a decision, so editing this file does not change any config hash.
analyzers:
  - kind: plant_health
    params:
      min_saturation: 40
      min_value: 30
      min_vegetation: 0.02
      stress_threshold: 0.25

