# SmolVLA fine-tuned on SO-101 "pick the red cube" (top + gripper cameras).
# Served by: python scripts/policy_server.py --policy smolvla
# Not an experiment config: never part of a config hash. See docs/arm-policies.md.
kind: smolvla
checkpoint: assets/svla_so101_red_cube
model_id: whosricky/svla-so101-pick-red-cube-2cam
model_revision: 5302eecfe373a3225642c3c9c94e385d6e32c139
# Stored in fp32; the VLM and action expert run in bf16 (0.6 s for 4 samples
# against 1.0+ s in fp32 on the 8 GB card; first actions differ by < 0.1 of
# 200 units).
dtype: bfloat16
fps: 30.0
# The checkpoint's n_action_steps: the open-loop length it was trained to execute.
horizon: 25
# Model camera slot -> robot camera. The arm stereo camera plays the dataset's
# gripper camera; the world camera stands in for its fixed top camera.
cameras:
  observation.images.gripper: image
  observation.images.top: world_left
# LeRobot's SO-101 units -> the arm's URDF radians (so101_new_calib.urdf, the
# convention the Gazebo model uses). The dataset's values saturate at -100 and
# +100, so it was recorded with use_degrees=false: body joints in range_m100_100,
# the ends of each calibrated range, gripper in range_0_100. Mapped onto the URDF
# joint limits, on the assumption that the calibrated range spans them with
# zero at the middle, as the new calibration intends. Approximate, and the
# same for both models; check each joint against a calibrated real arm before
# trusting an angle.
joints:
  shoulder_pan:  {model: [-100.0, 100.0], rad: [-1.91986, 1.91986]}
  shoulder_lift: {model: [-100.0, 100.0], rad: [-1.74533, 1.74533]}
  elbow_flex:    {model: [-100.0, 100.0], rad: [-1.69, 1.69]}
  wrist_flex:    {model: [-100.0, 100.0], rad: [-1.65806, 1.65806]}
  wrist_roll:    {model: [-100.0, 100.0], rad: [-2.74385, 2.84121]}
  gripper:       {model: [0.0, 100.0], rad: [-0.174533, 1.74533]}
# Spread of the sampled chunks -> uncertainty. Not calibrated: no held-out
# episodes exist for this checkpoint (it was trained on the whole dataset), so
# the numbers order observations but are not probabilities and are not
# comparable with the other model's. See docs/arm-policies.md.
uncertainty:
  method: uncalibrated
  scale: 0.02
