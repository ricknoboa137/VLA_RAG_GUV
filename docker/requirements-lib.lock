# Every package the carma library needs at runtime, transitive ones included,
# resolved on linux/amd64 for CPython 3.11.
#
# pyproject.toml pins what this project depends on directly. That is not enough
# to rebuild the same environment twice: a transitive dependency with no pin
# floats, so an image built next month can differ from this one in a package
# nobody chose. Everything is pinned here, and the install uses --no-deps, so
# the resolver cannot introduce anything this file does not name.
#
# Regenerate after changing pyproject.toml:
#   make lock
#
# Keep in step with requirements-dev.lock, which is this list plus the tools.
